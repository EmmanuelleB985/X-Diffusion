name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install linting tools
        run: pip install flake8 black isort mypy

      - name: Check formatting with black
        run: black --check --diff scripts/ DXAtoMRI/

      - name: Check import order with isort
        run: isort --check-only --diff --profile black scripts/ DXAtoMRI/

      - name: Lint with flake8
        run: flake8 .

      - name: Type check with mypy
        run: mypy scripts/ --ignore-missing-imports || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-cov pytest-timeout omegaconf numpy

      - name: Run tests
        run: pytest scripts/tests/ -v --tb=short --timeout=60

  docker:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t x-diffusion:ci .