[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["scripts/tests"]
python_files = ["test_*.py", "tests_*.py"]
markers = [
    "slow: slow tests",
]

[tool.black]
target-version = ["py39"]
extend-exclude = "scripts/ldm"

[tool.isort]
profile = "black"
skip_glob = ["scripts/ldm/*"]
